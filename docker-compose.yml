services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gramarogya
      POSTGRES_PASSWORD: gramarogya
      POSTGRES_DB: gramarogya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramarogya -d gramarogya"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://gramarogya:gramarogya@db:5432/gramarogya
      SMS_PROVIDER: mock
      FRONTEND_DIR: /app/frontend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: